name: Numerology 390 Scroll Diagnostic
on:
  push:
    branches: [qa/numerology-mobile-scroll-diagnostic]
    paths: [.github/workflows/numerology-390-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read

env:
  DATABASE_URL: postgresql://beaconvie:beaconvie_ci_password@localhost:5432/beaconvie_ci?schema=public
  REDIS_URL: redis://localhost:6379
  API_PORT: 4000
  API_BASE_URL: http://localhost:4000
  FRONTEND_URL: http://localhost:3000
  # Web SEO tests/build must model the canonical production origin.
  NEXT_PUBLIC_APP_URL: https://tuvitarot.vn
  NEXT_PUBLIC_SITE_INDEXABLE: 'true'
  APP_PUBLIC_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000
  JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-use-000000
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-use-000000
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 30d
  CSRF_SECRET: ci-only-csrf-secret-not-for-production-use-0000000000
  AUTH_COOKIE_DOMAIN: localhost
  AUTH_COOKIE_SECURE: 'false'
  AUTH_COOKIE_SAME_SITE: lax
  PASSWORD_RESET_EXPIRES_IN: 1h
  EMAIL_VERIFICATION_EXPIRES_IN: 24h
  EMAIL_VERIFICATION_RESEND_COOLDOWN: 2s
  EMAIL_PROVIDER: mailpit
  EMAIL_FROM: 'BeaconVie CI <no-reply@beaconvie.local>'
  MAILPIT_HOST: localhost
  MAILPIT_PORT: 1025
  # CI/E2E shares one runner IP across hundreds of auth requests. Keep production
  # limits unchanged; this test-only ceiling prevents cross-spec throttling.
  AUTH_RATE_LIMIT_MAX: 2000
  AUTH_RATE_LIMIT_WINDOW_MS: 900000
  # Dedicated account/memory/journal export bucket; test runner shares one IP.
  EXPORT_RATE_LIMIT_MAX: 100
  EXPORT_RATE_LIMIT_WINDOW_MS: 60000
  RATE_LIMIT_REDIS_PREFIX: 'beaconvie:throttle:ci'
  TRUST_PROXY: 'false'
  DEFAULT_AI_PROVIDER: mock
  FALLBACK_PROVIDER: mock
  AI_TIMEOUT_MS: 5000
  AI_MAX_RETRIES: 1
  # Generous, test-friendly ceilings — same reasoning as AUTH_RATE_LIMIT_MAX
  # above (see apps/api/.env.test.example): the backend e2e suite and the
  # Playwright flows both send companion messages from the same runner IP
  # within this job, and this only needs to comfortably exceed that total.
  AI_RATE_LIMIT_MAX: 200
  AI_RATE_LIMIT_WINDOW_MS: 60000
  AI_RATE_LIMIT_IP_MAX: 500
  AI_MAX_CONCURRENT_GENERATIONS_PER_USER: 1
  AI_CONCURRENCY_LOCK_TTL_MS: 120000
  AI_DAILY_REQUEST_LIMIT: 1000
  AI_DAILY_TOKEN_LIMIT: 200000
  AI_MONTHLY_TOKEN_LIMIT: 2000000
  DISCOVERY_RATE_LIMIT_MAX: 500
  DISCOVERY_RATE_LIMIT_WINDOW_MS: 60000
  DISCOVERY_RATE_LIMIT_IP_MAX: 1000
  # Test-only payment configuration; mock checkout prevents external PayOS calls.
  PAYOS_CLIENT_ID: test-only-payos-client-id-not-for-production
  PAYOS_API_KEY: test-only-payos-api-key-not-for-production
  PAYOS_CHECKSUM_KEY: test-only-payos-checksum-key-not-for-production-xxxxx
  PAYOS_BASE_URL: https://api-merchant.payos.vn
  PAYOS_MOCK_CHECKOUT: 'true'
  PAYMENTS_ENABLED: 'true'
  PREMIUM_PRICE_VND: 79000
  PREMIUM_DURATION_DAYS: 30
  PAYMENT_RATE_LIMIT_MAX: 200
  PAYMENT_RATE_LIMIT_WINDOW_MS: 60000
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beaconvie
          POSTGRES_PASSWORD: beaconvie_ci_password
          POSTGRES_DB: beaconvie_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beaconvie -d beaconvie_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - '1025:1025'
          - '8025:8025'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beaconvie/api prisma:generate
      - run: pnpm --filter @beaconvie/api exec prisma migrate deploy
      - run: pnpm --filter @beaconvie/api prisma:seed:reference
      - run: pnpm build:api
      - run: pnpm build:web
      - run: pnpm --filter @beaconvie/web exec playwright install --with-deps chromium
      - name: Run only Numerology 390px diagnostic
        shell: bash
        run: |
          mkdir -p numerology-diagnostic
          node apps/api/dist/src/main.js > numerology-diagnostic/api.log 2>&1 &
          NEXT_PUBLIC_APP_URL=http://localhost:3000 pnpm --filter @beaconvie/web start > numerology-diagnostic/web.log 2>&1 &
          for i in $(seq 1 45); do curl -sf http://localhost:4000/health/live && break; sleep 1; done
          for i in $(seq 1 45); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          PLAYWRIGHT_BASE_URL=http://localhost:3000 pnpm --filter @beaconvie/web exec playwright test e2e/numerology-v41-visual-qa.spec.ts --grep '390px' --workers=1 2>&1 | tee numerology-diagnostic/playwright.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerology-390-scroll-diagnostic
          path: |
            numerology-diagnostic/
            apps/web/test-results/
          retention-days: 7
