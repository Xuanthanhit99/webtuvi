name: Tarot Mobile Expo Web 390 Evidence

on:
  push:
    branches:
      - qa/tarot-mobile-expo-390
    paths:
      - .github/workflows/tarot-mobile-expo-390.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-expo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DEVTOOLS: '1'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Checkout exact Tarot PR head for Mobile tests
        run: |
          git fetch --no-tags origin feat/tarot-mobile-master-integration
          git checkout FETCH_HEAD -- apps/mobile/src/features/tarot/api.test.ts
      - name: Run Tarot Mobile API contract tests
        run: pnpm --filter @beaconvie/mobile test --runInBand src/features/tarot/api.test.ts
      - name: Install Chromium
        run: pnpm --filter @beaconvie/web exec playwright install --with-deps chromium
      - name: Start real Expo Web app
        shell: bash
        run: |
          mkdir -p tarot-mobile-evidence
          (pnpm --filter @beaconvie/mobile exec expo start --web --host localhost --port 19006 > tarot-mobile-evidence/expo.log 2>&1) &
          echo $! > tarot-mobile-evidence/expo.pid
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://localhost:19006/tarot -o /dev/null 2>/dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            tail -n 120 tarot-mobile-evidence/expo.log
            exit 1
          fi
      - name: Capture 78-card selection with explicit QA API fixture
        run: pnpm --filter @beaconvie/web exec node scripts/tarot-mobile-selection-qa.cjs
      - name: Capture actual Tarot route at 390px
        shell: bash
        run: |
          pnpm --filter @beaconvie/web exec playwright screenshot \
            --browser chromium \
            --viewport-size "390,844" \
            --wait-for-timeout 8000 \
            --full-page \
            http://localhost:19006/tarot \
            ../../tarot-mobile-evidence/tarot-mobile-expo-web-390.png
          test -s tarot-mobile-evidence/tarot-mobile-expo-web-390.png
      - name: Upload screenshot and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarot-mobile-expo-web-390
          path: |
            tarot-mobile-evidence/tarot-mobile-expo-web-390.png
            tarot-mobile-evidence/tarot-mobile-selection-390-fixture.png
            tarot-mobile-evidence/selection-qa.json
            tarot-mobile-evidence/expo.log
          if-no-files-found: warn
          retention-days: 7
