name: menhvi-mobile-qa

services:
  postgres:
    image: postgres:16-alpine
    container_name: menhvi-mobile-qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: menhvi
      POSTGRES_PASSWORD: menhvi_dev_password
      POSTGRES_DB: menhvi
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - menhvi_mobile_qa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menhvi -d menhvi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: menhvi-mobile-qa-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - menhvi_mobile_qa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menhvi_mobile_qa_postgres_data:
  menhvi_mobile_qa_redis_data:
